name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/eternalnotes:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/eternalnotes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update docker-compose image reference
        run: |
          sed -i "s|build: \.|image: ${{ secrets.DOCKERHUB_USERNAME }}/eternalnotes:${{ github.ref_name }}|" docker-compose.yml

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            docker-compose.yml
            .env.demo
          body: |
            ## EternalNotes ${{ github.ref_name }}

            Self-hosted, offline-first AI note search. Your data never leaves your machine.

            ### Quick start

            ```bash
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/docker-compose.yml -o docker-compose.yml
            curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/.env.demo -o .env
            # Edit .env — set AUTH_SESSION_SECRET and PERSONAL_API_KEY_SECRET before production use
            docker compose up -d
            ```

            Open http://localhost:3000 after models finish downloading (~5–20 min on first run).

            See [TROUBLESHOOT.md](https://github.com/${{ github.repository }}/blob/main/TROUBLESHOOT.md) if anything doesn't work.
