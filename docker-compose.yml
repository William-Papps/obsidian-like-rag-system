services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags | grep -q nomic-embed-text || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  init-models:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        until curl -sf http://ollama:11434/api/tags > /dev/null; do sleep 2; done;
        ollama pull nomic-embed-text;
        ollama pull llama3.2:3b;
        ollama pull moondream
      "
    restart: on-failure

  app:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    environment:
      - NODE_ENV=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - AUTH_SESSION_SECRET=${AUTH_SESSION_SECRET:?Set AUTH_SESSION_SECRET in .env}
      - PERSONAL_API_KEY_SECRET=${PERSONAL_API_KEY_SECRET:?Set PERSONAL_API_KEY_SECRET in .env}
      - ALLOW_SELF_SIGNUP=${ALLOW_SELF_SIGNUP:-true}
      - OWNER_EMAIL=${OWNER_EMAIL:-}
      - HOSTED_AI_ENABLED=${HOSTED_AI_ENABLED:-false}
      - EMAIL_VERIFICATION_REQUIRED=${EMAIL_VERIFICATION_REQUIRED:-false}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - TRUST_PROXY=${TRUST_PROXY:-false}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q '\"ready\":true' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  ollama_data:
  app_data:
